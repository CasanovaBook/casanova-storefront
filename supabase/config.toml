# Supabase project configuration for the content-delivery Edge Functions.
#
# These functions are called by a storefront that has no Supabase Auth
# session (login is handled client-side), so there is no JWT to verify.
# verify_jwt = false lets them be invoked with just the public anon key;
# they authorize by deriving the Storage path server-side from the validated
# product_id and by keeping the service_role key inside the function runtime.
project_id = "zlweiqsqfsspecrubfuf"

# ── password policy: what the auth server can and cannot enforce ─────────────
#
# Verified against the auth server's own source and the current Auth Hooks
# reference, because the storefront states a password rule and it matters
# whether the rule can be trusted to anything behind the browser:
#
#   ENFORCEABLE SERVER-SIDE (project Auth settings, Dashboard →
#   Authentication → Providers → Email):
#     • minimum password length
#     • required character classes (lower / upper / digit / symbol)
#     • leaked-password rejection via HaveIBeenPwned (Pro plan and above)
#   The server also always refuses a password longer than 72 characters, the
#   bcrypt limit - src/lib/auth.ts states the same cap so the customer never
#   meets that sentence in English on a Hebrew form.
#
#   NOT ENFORCEABLE SERVER-SIDE: this project's rule that a password contain
#   no Hebrew, Arabic, emoji or spaces. The class check is implemented as
#   `strings.ContainsAny`, which only requires that a class appear - it never
#   refuses a character outside the listed sets - and no Auth Hook can fill the
#   gap: the available hooks are custom_access_token, send_sms, send_email,
#   mfa_verification_attempt and password_verification_attempt. The last of
#   those runs on sign-in with a payload of {user_id, valid} and never sees the
#   password, and before_user_created sees the user record, not the secret.
#   Proxied signup through an edge function would not close it either: the
#   public /auth/v1/signup endpoint stays reachable with the anon key.
#
# So the character rule lives in the client (enforced at every screen that
# sets a password and at the two supabase-auth.ts chokepoints), and it is a
# quality-and-supportability rule, not an access-control boundary. Anyone
# determined enough to bypass it damages only their own account.
#
# Before raising the server-side minimum: an existing account whose password
# falls short gets a WeakPasswordError on sign-in, so the mapping in
# translateAuthError must be in place first and the change should be staged.
# No [auth] values are set here on purpose - `supabase config push` applies the
# whole auth configuration to the live project, which needs an explicit
# decision, and the exact key names were not verified against this CLI version.
# ─────────────────────────────────────────────────────────────────────────────

[functions.get-content-url]
verify_jwt = false

[functions.create-upload-url]
verify_jwt = false

# Same arrangement as the two above: the JWT is verified inside the function
# so the caller's identity can be checked against public.users.role before
# anything privileged happens. This one mints a recovery link, so it is the
# most sensitive of the three - it must never be reachable by a customer.
[functions.admin-password-reset]
verify_jwt = false

# The customer-facing half of the sealed reset flow. The caller is an
# anonymous customer mid-recovery and there is no session to verify: the
# single-use 128-bit id in the request body is itself the bearer secret,
# consumed atomically by the function (DELETE … RETURNING on
# password_reset_links, a table no client key can read).
[functions.redeem-password-reset]
verify_jwt = false

# Same arrangement as the others: the JWT is verified inside the function so
# the caller's role can be checked against public.users.role (ADMIN only)
# before any privileged Storage lookup happens. It reports only whether the
# deterministic object books/product-<id>/book.pdf exists - never a path, a
# public URL or a signed URL - so it is safe to expose the admin status signal
# without leaking where the protected file lives.
[functions.get-content-status]
verify_jwt = false

# Public guest checkout. There is no customer session to verify: the function
# validates the contact details, resolves or creates the account by email, and
# performs every privileged write with the service role. The
# create_guest_storefront_order RPC it calls is executable only by service_role.
[functions.guest-checkout]
verify_jwt = false

# Public support submission for visitors without an account. The function
# validates the payload, applies a per-instance rate limit, verifies Turnstile
# when TURNSTILE_SECRET_KEY is set, and performs the insert with the service
# role through create_guest_inquiry (service_role only). No session exists to
# verify, which is the point of the endpoint.
[functions.support-inquiry]
verify_jwt = false

# Sends the numbered confirmation/reply email. The JWT is verified inside the
# function so the caller can be checked: the ticket owner for a confirmation,
# an ADMIN for a customer-visible reply. Called from the storefront and the
# admin panel after the row already exists, so delivery is best-effort.
[functions.support-mail]
verify_jwt = false

# Inbound email webhook. Authorized by the SUPPORT_INBOUND_SECRET header, not
# by a JWT: the caller is a mail provider. The function maps the ticket number
# and sender to support_inbound_reply, which re-checks that the sender matches
# the address that opened the ticket.
[functions.support-inbound]
verify_jwt = false
