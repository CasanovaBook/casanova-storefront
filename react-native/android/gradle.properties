# Build JVM. The React Native Gradle plugin, Kotlin, codegen and Hermes all run
# in this daemon; the template's 2048m is enough for the template and tight for
# an app with nine native dependencies. Exhausting it produces OOM kills that
# look like flaky builds rather than like a setting.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# AndroidX package structure.
android.useAndroidX=true

# android.enableJetifier is deliberately absent. Every native dependency here
# (react-native-pdf, blob-util, keychain, device-info, async-storage, screens,
# safe-area-context) is AndroidX-native, so jetifying rewrites nothing and costs
# a few seconds per clean build. Add it back only if a future dependency turns
# out to still reference com.android.support.

# Architectures to build. All four, including the x86 pair, because of a
# decision made elsewhere in this app: `ScreenShieldModule.deviceIntegrity()`
# reports EMULATOR and the reader refuses to open a book on one. Verifying that
# refusal requires an emulator build to exist.
#
# Override per invocation with -PreactNativeArchitectures=arm64-v8a to cut a
# debug build down to the one ABI the test device actually needs.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New Architecture (Fabric + TurboModules). ScreenShieldModule is written
# against the bridge API, which the New Architecture still serves through the
# interop layer, so it needs no codegen spec and no .h/.cpp of its own.
newArchEnabled=true

# Hermes. The JavaScript that reaches a device is Hermes bytecode rather than
# source, which is not obfuscation but does mean the vault path and the grant
# flow are not sitting in a bundle as readable text.
hermesEnabled=true
