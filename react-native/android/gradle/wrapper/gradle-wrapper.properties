distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Pinned to the Gradle the React Native 0.79 template ships with. Gradle and the
# Android Gradle Plugin have a compatibility matrix that is not symmetric: a
# newer Gradle usually works with an older AGP, an older Gradle never works with
# a newer AGP. Changing this without changing AGP in build.gradle is how a build
# starts failing with errors about task registration rather than about versions.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
